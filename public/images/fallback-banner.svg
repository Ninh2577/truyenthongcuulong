<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" fill="none">
    <defs>
        <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#070f1e"/>
            <stop offset="50%" stop-color="#0c1a30"/>
            <stop offset="100%" stop-color="#102344"/>
        </linearGradient>
        <pattern id="dot-pattern" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
            <circle cx="2" cy="2" r="1" fill="#38bdf8" fill-opacity="0.15"/>
        </pattern>
    </defs>
    
    <!-- Background -->
    <rect width="100%" height="100%" fill="url(#bg-grad)"/>
    <rect width="100%" height="100%" fill="url(#dot-pattern)"/>
    
    <!-- Subtle glow ring -->
    <circle cx="400" cy="250" r="160" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="6 8" stroke-opacity="0.2"/>
    <circle cx="400" cy="250" r="110" fill="#0284c7" fill-opacity="0.04"/>
    
    <!-- Center Tech Brand Shield Icon -->
    <g transform="translate(360, 210)">
        <rect x="0" y="0" width="80" height="80" rx="20" fill="#0b1b33" stroke="#334155" stroke-width="1.5"/>
        <path d="M26 40L36 50L54 32" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    
    <!-- Brand Label -->
    <text x="400" y="325" text-anchor="middle" font-family="'Mulish', -apple-system, sans-serif" font-size="14" font-weight="700" fill="#94a3b8" letter-spacing="2">
        TRUYỀN THÔNG CỬU LONG
    </text>
    <text x="400" y="348" text-anchor="middle" font-family="'Mulish', -apple-system, sans-serif" font-size="11" font-weight="500" fill="#64748b" letter-spacing="1">
        B2B TECHNOLOGY &amp; MEDIA ECOSYSTEM
    </text>
</svg>
