<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
    <defs>
        <linearGradient id="growthGrad" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#ff4500" />
            <stop offset="50%" stop-color="#ff6a00" />
            <stop offset="100%" stop-color="#ff9d42" />
        </linearGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#ff5e00" flood-opacity="0.6"/>
        </filter>
    </defs>
    <!-- Background subtle circle aura -->
    <circle cx="24" cy="24" r="22" fill="#ff5e00" fill-opacity="0.08" stroke="#ff5e00" stroke-opacity="0.25" stroke-width="1"/>
    
    <!-- Upward swoosh arrow -->
    <g filter="url(#glow)">
        <path d="M12 34 C 16 32, 22 26, 27 20 C 31 15, 34 12, 36 10" stroke="url(#growthGrad)" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M25 10 L 36 10 L 36 21" stroke="url(#growthGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- Sparkle stars -->
    <circle cx="39" cy="8" r="1.5" fill="#fed7aa"/>
    <circle cx="26" cy="7" r="1" fill="#fed7aa"/>
</svg>
