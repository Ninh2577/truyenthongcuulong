name: Auto Deploy to cPanel

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Hosting via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd ~/public_html
            git fetch origin master
            git reset --hard origin/master
            [ -d images ] && cp -ru public/images/* images/ 2>/dev/null || true
            php artisan migrate --force
            php artisan db:seed --class=TemplateShowcaseSeeder --force
            php artisan db:seed --class=CaseStudySeeder --force
            php artisan db:seed --class=MenuSeeder --force
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
